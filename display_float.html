<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Float</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        /* box-sizing: border-box; */
      }

      ul,
      li {
        list-style: none;
      }

      .box {
        width: 600px;
        height: 500px;
        border: 2px solid red;
        margin: 0 auto;
      }

      .box li {
        float: left;
        width: 190px;
        height: 200px;
        margin-right: 15px;
        margin-bottom: 15px;
      }

      .box li:nth-child(odd) {
        background-color: pink;
      }
      .box li:nth-child(even) {
        background-color: skyblue;
      }

      .box li:nth-child(3n) {
        margin-right: 0;
      }
    </style>
  </head>
  <body>
    <ul class="box">
      <li>First box</li>
      <li>Second box</li>
      <li>Third box</li>
      <li>First box</li>
      <li>Second box</li>
      <li>Third box</li>
    </ul>
  </body>
</html>
