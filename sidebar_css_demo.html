<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar</title>
    <link rel="stylesheet" href="iconfonts/iconfont.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      a {
        color: #1f1f1f;
        text-decoration: none;
      }

      ul {
        list-style: none;
      }

      .service {
        width: 256px;
        height: 400px;
        background-color: #f7f7f7;
        border-radius: 14px;
        margin: 100px auto;
      }

      .service .service-title {
        line-height: 40px;
        padding: 8px 0 0 16px;
        font-size: 16px;
        font-weight: 600;
        color: #1f1f1f;
      }

      .service-title img {
        width: 20px;
        height: 20px;
        margin-left: 4px;
        /* vertical-align: middle; */
      }

      .service-bd li {
        height: 32px;
        line-height: 32px;
        margin: 0 14px;
        border-radius: 6px;
        transition: all 0.5s;
        padding-left: 10px;
      }

      /* The text color of a tag needs to be styled separately. */
      .service-bd li:first-child,
      .service-bd li:first-child a {
        color: #ff5000;
      }

      .service-bd li:hover {
        background-color: white;
      }

      .service-bd li i {
        margin-right: 2px;
      }

      .service-bd li a {
        font-size: 14px;
      }

      .service-bd li a:hover {
        color: #ff5000;
      }
    </style>
  </head>
  <body>
    <div class="service">
      <div class="service-title">
        <span>Shop</span>
        <img src="images/shop-sign-blink.gif" alt="Animated shop sign" />
      </div>
      <ul class="service-bd">
        <li>
          <i class="iconfont icon-laptop"></i>
          <a href="#">Computer</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Phone</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">AI</a>
        </li>
        <li>
          <i class="iconfont icon-shirt"></i>
          <a href="#">Clothing</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Shoes</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Bags</a>
        </li>
        <li>
          <i class="iconfont icon-couch-solid"></i>
          <a href="#">Furniture</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Kitchen</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Home</a>
        </li>
        <li>
          <i class="iconfont icon-SPA"></i>
          <a href="#">Beauty</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Skincare</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Makeup</a>
        </li>
        <li>
          <i class="iconfont icon-dumbbell"></i>
          <a href="#">Sports</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Fitness</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Outdoor</a>
        </li>
        <li>
          <i class="iconfont icon-book"></i>
          <a href="#">Books</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Music</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Games</a>
        </li>
        <li>
          <i class="iconfont icon-utensils"></i>
          <a href="#">Food</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Drinks</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Snacks</a>
        </li>
        <li>
          <i class="iconfont icon-camera"></i>
          <a href="#">Camera</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Audio</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Gadgets</a>
        </li>
        <li>
          <i class="iconfont icon-gift"></i>
          <a href="#">Watches</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Jewelry</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Gifts</a>
        </li>
        <li>
          <i class="iconfont icon-puzzle-piece"></i>
          <a href="#">Toys</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Kids</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Baby</a>
        </li>
        <li>
          <i class="iconfont icon-paw"></i>
          <a href="#">Pets</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Garden</a>
          <span class="iconfont icon-slash"></span>
          <a href="#">Tools</a>
        </li>
      </ul>
    </div>
  </body>
</html>
