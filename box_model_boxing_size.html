<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boxing size</title>
    <style>
      .box1 {
        width: 200px;
        height: 200px;
        background-color: pink;
        border: 5px solid red;
        padding: 20px;
      }

      .box2 {
        width: 200px;
        height: 200px;
        background-color: pink;
        box-sizing: border-box;
        border: 5px solid red;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <div class="box1">Box1</div>
    <div class="box2">Box2</div>
  </body>
</html>
