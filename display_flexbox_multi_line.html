<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi line</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        width: 80%;
        margin: 20px auto;
      }

      .box {
        display: flex;
        flex-wrap: wrap;
        border: 2px solid red;
        margin-left: -8px;
        margin-right: -8px;
      }

      .box .item {
        /* width: 80px; */
        /* flex: 1; */
        flex: 0 0 16.666667%;
        height: 120px;
        /* background-color: pink; */
        margin-bottom: 16px;
        /* margin-right: 16px; */
        padding: 0 8px;
      }

      .box .item .content {
        height: 100%;
        background-color: pink;
      }

      .footer {
        width: 80%;
        height: 120px;
        background-color: black;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <div class="item">
          <div class="content">1</div>
        </div>
        <div class="item">
          <div class="content">2</div>
        </div>
        <div class="item">
          <div class="content">3</div>
        </div>
        <div class="item">
          <div class="content">4</div>
        </div>
        <div class="item">
          <div class="content">5</div>
        </div>
        <div class="item">
          <div class="content">6</div>
        </div>
        <div class="item">
          <div class="content">7</div>
        </div>
        <div class="item">
          <div class="content">8</div>
        </div>
        <div class="item">
          <div class="content">9</div>
        </div>
        <div class="item">
          <div class="content">10</div>
        </div>
        <div class="item">
          <div class="content">11</div>
        </div>
        <div class="item">
          <div class="content">12</div>
        </div>
        <div class="item">
          <div class="content">13</div>
        </div>
        <div class="item">
          <div class="content">14</div>
        </div>
      </div>
    </div>

    <div class="footer"></div>
  </body>
</html>
