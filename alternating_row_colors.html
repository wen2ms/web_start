<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alternating row colors</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      .data {
        border-collapse: collapse;
        border: 1px solid #f1f1f1;
        width: 400px;
        margin: 0 auto;
        text-align: center;
        font-size: 16px;
      }

      .data tr {
        height: 35px;
      }

      .data tbody tr:nth-child(even) {
        background-color: #f9f9f9;
      }

      .data thead tr {
        background-color: #8fbcf1;
        color: #fff;
      }

      .data thead tr:hover,
      .data tbody tr:hover {
        background-color: burlywood;
      }
    </style>
  </head>
  <body>
    <table class="data">
      <thead>
        <tr>
          <th>Name</th>
          <th>Data</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Alice</td>
          <td>85</td>
          <td>2026-10-01</td>
        </tr>
        <tr>
          <td>Bob</td>
          <td>92</td>
          <td>2026-10-02</td>
        </tr>
        <tr>
          <td>Charlie</td>
          <td>78</td>
          <td>2026-10-03</td>
        </tr>
        <tr>
          <td>David</td>
          <td>88</td>
          <td>2026-10-04</td>
        </tr>
        <tr>
          <td>Emma</td>
          <td>95</td>
          <td>2026-10-05</td>
        </tr>
        <tr>
          <td>Frank</td>
          <td>73</td>
          <td>2026-10-06</td>
        </tr>
        <tr>
          <td>Grace</td>
          <td>90</td>
          <td>2026-10-07</td>
        </tr>
        <tr>
          <td>Henry</td>
          <td>82</td>
          <td>2026-10-08</td>
        </tr>
        <tr>
          <td>Ivy</td>
          <td>97</td>
          <td>2026-10-09</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
