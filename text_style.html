<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Style</title>
    <style>
      .font-color {
        /* color: pink; */
        /* color: #669cd1; */
        /* color: rgb(255, 0, 0); */
        color: rgb(255, 0, 0, 0.7);
      }

      .font-family {
        font-family: "SimHei", sans-serif;
      }

      .font-size {
        font-size: 18px;
      }

      .font-style {
        font-style: italic;
      }

      em {
        font-style: normal;
      }

      .font-weight {
        /* font-weight: normal; */
        font-weight: 400;
      }

      .font-weight-paragraph {
        /* font-weight: bold; */
        font-weight: 700;
      }

      a {
        text-decoration: none;
      }

      .underline {
        text-decoration: underline;
      }

      .line-through {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <h2>1. Font color</h2>
    <p class="font-color">Color</p>
    <h2>2. Font family</h2>
    <p class="font-family">Famliy</p>
    <h2>3. Font size</h2>
    <p class="font-size">Size</p>
    <h2>4. Font style</h2>
    <p class="font-style">Style</p>
    <em>Style</em>
    <h2 class="font-weight">5. Font weight</h2>
    <p class="font-weight-paragraph">weight</p>
    <h2>6. Font decoration</h2>
    <a href="#">decoration</a>
    <p class="underline">decoration</p>
    <p class="line-through">decoration</p>
  </body>
</html>
