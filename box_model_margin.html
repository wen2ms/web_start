<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Margin</title>
    <style>
      [class^="box"] {
        width: 200px;
        height: 200px;
        background-color: pink;
      }

      .box1 {
        /* order like border  */
        /* margin: 10px;
        margin: 10px 20px;
        margin: 10px 20px 30px; */
        /* margin: 10px 20px 30px 40px; */
        margin-bottom: 10px;
      }

      .box2 {
        background-color: skyblue;
      }

      span {
        /* Width, height, and vertical margins do not apply to inline elements. */
        width: 100px;
        height: 100px;
        background-color: pink;
        margin: 20px 20px;
        padding: 10px;
        border: 5px solid red;
      }

      .box3 {
        /* margin: 0 auto; */
        /* margin: auto; */

        margin-left: auto;
        margin-right: auto;
      }
      .box4 {
        background-color: skyblue;
        margin-left: auto;
      }

      p {
        text-align: center;
      }

      /* Margin collapsing occurs when the vertical margins of block-level elements overlap,
        resulting in a single margin instead of adding together. */

      .box6 {
        margin-bottom: 100px;
      }

      /* Apply margin-top to only one block element. */
      .box7 {
        margin-top: 50px;
        background-color: skyblue;
      }

      /* Parent and child: Vertical margins can collapse between a parent and its child. */
      .parent {
        height: 150px;
        width: 150px;
        background-color: pink;
        /* Method 1: Add border to parent */
        /* border: 1px solid #000; */

        /* Method2: Add padding top */
        /* padding-top: 20px; */
      }

      .child {
        width: 80px;
        height: 80px;
        background-color: purple;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box1">Box1</div>
    <div class="box2">Box2</div>
    <span>Inline box</span>
    <span>Inline box</span>
    <div class="box3">Box3</div>
    <div class="box4">Box4</div>
    <div class="box5">Box5</div>
    <p><span>Inline box</span></p>
    <div class="box6">Box6</div>
    <div class="box7">Box7</div>

    <div class="parent">
      <div class="child"></div>
    </div>
  </body>
</html>
