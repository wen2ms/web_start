<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox subitem</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .box {
        display: flex;
        width: 80%;
        border: 2px solid red;
        margin: 0 auto;
        /* Only controls the spacing between boxes. */
        gap: 10px;
      }

      .box .item {
        flex: 1;
        /* width: 80px; */
        height: 100px;
        background-color: pink;
        /* margin-right: 10px; */
      }

      .box .item:nth-child(odd) {
        background: purple;
      }

      /* .box .item:nth-child(3) {
        flex: 2;
      } */
    </style>
  </head>
  <body>
    <div class="box">
      <div class="item">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item">4</div>
    </div>
  </body>
</html>
