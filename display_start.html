<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      a {
        text-decoration: none;
      }

      ul,
      li {
        list-style: none;
      }

      .subbar {
        width: 234px;
        height: 460px;
        background-color: #9d9b9b;
        margin: 100px auto;
        padding: 20px 0;
        font-size: 14px;
      }

      .subbar ul li a {
        display: block;
        height: 42px;
        line-height: 42px;
        color: #fff;
        padding-left: 20px;
      }

      .subbar ul li a:hover {
        background-color: #ff6700;
      }

      .list {
        width: 400px;
        height: 400px;
        border: 1px solid red;
        margin: 0 auto;
      }

      .list a {
        display: inline-block;
        height: 30px;
        line-height: 30px;
        color: #fff;
        background-color: #ccc;
        border-radius: 5px;
        font-size: 12px;
        padding: 0 15px;
        margin: 4px;
      }
    </style>
  </head>
  <body>
    <div class="subbar">
      <ul>
        <li><a href="#">Phone</a></li>
        <li><a href="#">Laptop</a></li>
        <li><a href="#">Tablet</a></li>
        <li><a href="#">Headphones</a></li>
        <li><a href="#">Smartwatch</a></li>
        <li><a href="#">Camera</a></li>
        <li><a href="#">Keyboard</a></li>
        <li><a href="#">Mouse</a></li>
        <li><a href="#">Monitor</a></li>
        <li><a href="#">Speaker</a></li>
      </ul>
    </div>

    <div class="list">
      <a href="#">Wallpaper</a>
      <a href="#">Photography</a>
      <a href="#">Illustration</a>
      <a href="#">Landscape</a>
      <a href="#">Abstract</a>
    </div>
  </body>
</html>
