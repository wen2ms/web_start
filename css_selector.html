<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Css selector</title>
    <style>
      /* Element Selector */
      div {
        color: blue;
        font-size: 20px;
      }

      strong {
        color: purple;
      }

      li {
        color: pink;
      }

      /* Class Selector */
      .jack {
        color: black;
      }

      .ul-li-mum {
        color: brown;
      }

      /* ID Selector */
      #bro {
        color: bisque;
      }
    </style>
  </head>
  <body>
    <div>I am George, I like blue.</div>
    <div class="jack">I am Jack, I like black.</div>
    <div>I am Jucy, I don't like color.</div>
    <strong>I like purple.</strong>
    <ul>
      <li class="ul-li-mum">Mum</li>
      <li>Dad</li>
      <li id="bro">Bro</li>
    </ul>
  </body>
</html>
