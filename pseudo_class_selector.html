<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo-class selector</title>
    <style>
      /* order: link, visited, hover, active */
      /* Unvisited link */
      a:link {
        color: #000;
        text-decoration: none;
      }

      a:visited {
        color: peru;
        /* To protect browsing history, browsers only allow :visited to change certain color properties. */
        /* text-decoration: underline; */
      }

      a:hover {
        color: red;
        text-decoration: underline;
      }

      a:active {
        color: blue;
        text-decoration: none;
      }

      .box {
        width: 100px;
        height: 100px;
        background-color: pink;
        text-align: center;
        line-height: 100px;
      }

      .box:hover {
        background-color: red;
        color: whitesmoke;
      }

      .search {
        width: 100px;
        height: 20px;
      }

      .search:focus {
        width: 200px;
        background-color: red;
      }
    </style>
  </head>
  <body>
    <a href="https://www.google.com">Google</a>
    <a href="#">Introduction</a>
    <a href="#">About us</a>
    <div class="box">Text</div>
    <input type="text" class="search" />
  </body>
</html>
